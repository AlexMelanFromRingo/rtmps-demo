version: 2

updates:
  - package-ecosystem: npm
    directories: ["/server", "/web"]
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore
      include: scope
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: gomod
    directory: /deploy/srt-gateway
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore
      include: scope
    groups:
      go-minor-patch:
        update-types: [minor, patch]

  # Base images in Dockerfiles (node, golang, alpine, nginx, mediamtx, ffmpeg).
  - package-ecosystem: docker
    directories: ["/server", "/deploy/ingest", "/deploy/srt-gateway", "/deploy/edge"]
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore
      include: scope
    groups:
      docker-minor-patch:
        update-types: [minor, patch]

  # Images in compose files (postgres, valkey, seaweedfs, prometheus, grafana).
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore
      include: scope
    groups:
      compose-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
