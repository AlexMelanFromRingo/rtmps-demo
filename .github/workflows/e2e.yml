name: E2E

# Full stack in Docker + real FFmpeg publishers (RTMP/SRT/WHIP × codecs).
# Heavy (~15–30 min), so it runs on demand and on pushes to the repository's
# default branch only (whatever it is called — see the job's `if`).
on:
  workflow_dispatch:
  push:
    branches: [main, "claude/**"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - ".github/dependabot.yml"

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    if: github.event_name == 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # Tuned for a 4-vCPU hosted runner: 2 full transcodes in total, the
      # remaining concurrent test streams run in degraded mode (the suite
      # accepts both). WORKER_REPLICAS=2 is required by the failover test.
      WORKER_SLOTS: "1"
      API_REPLICAS: "2"
      WORKER_REPLICAS: "2"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Pre-pull the publisher image used by the tests
        # Otherwise the first test pays for the pull inside its timeout.
        run: docker pull mwader/static-ffmpeg:9.0.2-1

      - name: Build and start the stack
        timeout-minutes: 20
        run: docker compose up -d --build

      - name: Wait for edge and API
        timeout-minutes: 10
        run: |
          for i in $(seq 1 120); do
            if curl -fsS -o /dev/null http://localhost:8080/edge-health \
              && curl -fsS -o /dev/null http://localhost:8080/api/streams; then
              echo "stack ready after ~$((i * 5)) s"
              docker compose ps
              exit 0
            fi
            sleep 5
          done
          echo "::error::stack did not become ready"
          docker compose ps -a
          exit 1

      - name: Install test dependencies
        working-directory: server
        run: npm ci --no-audit --no-fund

      - name: Run e2e suite
        working-directory: server
        timeout-minutes: 30
        run: npm run test:e2e

      - name: Dump logs on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --timestamps > compose-logs.txt 2>&1 || true
          docker compose logs --no-color --timestamps --tail=200 || true
          for c in $(docker ps -aq --filter name=^e2e-); do
            echo "── publisher $(docker inspect -f '{{.Name}} {{.State.Status}} {{.State.ExitCode}}' "$c")"
            docker logs --tail=50 "$c" 2>&1 || true
          done

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-compose-logs
          path: compose-logs.txt
          retention-days: 7
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        run: |
          docker ps -aq --filter name=^e2e- | xargs -r docker rm -f
          docker compose down -v --remove-orphans
